[project]
name = "alme-benchmark"
version = "0.1.0"
description = "ALME: Audio-LLM Modality Evaluation Benchmark"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40,<4.46",
    "accelerate>=0.25",
    "peft>=0.7",
    "bitsandbytes>=0.43",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.11",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.scripts]
alme-eval = "alme.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alme"]
